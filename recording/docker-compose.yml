version: "3.8"
services:
  recorder:
    build:
      context: .
      dockerfile: Dockerfile.recording
    volumes:
      - .:/app
      - ./shared:/shared
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    tty: true


